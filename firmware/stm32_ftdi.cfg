# OpenOCD config: program STM32F103 through an FT232RL (bit-bang SWD)
#
# NOTE: OpenOCD cannot use the STM32 UART ROM bootloader (AN3155).
# The FT232R has no MPSSE, so OpenOCD drives it in synchronous bit-bang
# mode with the "ft232r" driver and talks SWD to the chip instead.
#
# Usage:
#   openocd -f stm32f103_ft232r.cfg -c "flash_fw firmware.elf"
#   openocd -f stm32f103_ft232r.cfg -c "flash_fw firmware.bin 0x08000000"
#
# Wiring (FT232RL pin -> STM32F103), bit numbers: TXD=0 RXD=1 RTS=2 CTS=3 DTR=4 DSR=5 DCD=6 RI=7
#   TXD (0) -> SWCLK (PA14)
#   RTS (2) -> SWDIO (PA13), via ~470R series resistor
#   DTR (4) -> NRST
#   GND     -> GND

adapter driver ft232r
ft232r vid_pid 0x0403 0x6001
# Older OpenOCD (<0.12): use  ft232r_vid_pid 0x0403 0x6001  and the ft232r_*_num forms below

ft232r tck_num TXD
ft232r tms_num RTS
ft232r tdi_num CTS
ft232r tdo_num RXD
# ft232r swclk_num TXD
# ft232r swdio_num RTS
ft232r srst_num DTR

adapter speed 1000
# transport select jtag
reset_config srst_only srst_nogate connect_assert_srst

set CHIPNAME stm32f103
source [find target/stm32f1x.cfg]

proc flash_fw {file {addr ""}} {
    init
    reset halt
    if {$addr eq ""} {
        program $file verify reset exit
    } else {
        program $file $addr verify reset exit
    }
}